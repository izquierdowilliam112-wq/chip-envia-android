name: Chip Envía Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source
        run: unzip -q chip-envia-source-v2.zip
      - name: Generate Gradle wrapper
        working-directory: ChipEnvía
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build APK
        working-directory: ChipEnvía
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleDebug
      - name: Check APK
        run: test -s 'ChipEnvía/app/build/outputs/apk/debug/app-debug.apk'
      - name: Prepare release APK
        run: cp 'ChipEnvía/app/build/outputs/apk/debug/app-debug.apk' "Chip-Envía-Android-0.1.0-build-${GITHUB_RUN_NUMBER}.apk"
      - name: Upload installable APK to private GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chip-envia-v0.1.0-build-${{ github.run_number }}
          name: Chip Envía Android 0.1.0 build ${{ github.run_number }}
          body: 'Installable Android debug APK built from the private repository. Debug-signed; not a Play Store release. Test on Android before regular use.'
          files: Chip-Envía-Android-0.1.0-build-${{ github.run_number }}.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: chip-envia-debug-apk
          path: Chip-Envía-Android-0.1.0-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source
        run: unzip -q chip-envia-source-v2.zip
      - name: Generate Gradle wrapper
        working-directory: ChipEnvía
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build APK
        working-directory: ChipEnvía
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleDebug
      - name: Check APK
        run: test -s ChipEnvía/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chip-envia-debug-apk
          path: ChipEnvía/app/build/outputs/apk/debug/app-debug.apk
