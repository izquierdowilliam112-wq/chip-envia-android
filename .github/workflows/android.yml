name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack Android project
        run: unzip -q chip-envia-source.zip
      - name: Generate Gradle wrapper
        working-directory: ChipEnvía
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build APK
        working-directory: ChipEnvía
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s ChipEnvía/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK (private Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chip-envia-debug-apk
          path: ChipEnvía/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
