name: Chip Envia APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: unzip -q chip-envia-source-v2.zip
      - working-directory: ChipEnvía
        run: gradle wrapper --gradle-version 8.11.1
      - working-directory: ChipEnvía
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleDebug
      - run: cp 'ChipEnvía/app/build/outputs/apk/debug/app-debug.apk' 'Chip-Envía-debug.apk'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chip-envia-build-${{ github.run_number }}
          name: Chip Envía Android build ${{ github.run_number }}
          body: 'Installable debug APK for testing. Not Play Store signed; not yet validated on physical phones.'
          files: Chip-Envía-debug.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: Chip-Envía-debug-APK
          path: Chip-Envía-debug.apk
          retention-days: 30
